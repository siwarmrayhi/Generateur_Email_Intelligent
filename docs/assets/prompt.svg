<svg width="1000" height="330" viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Génération conditionnelle : un prompt structuré avec contexte et ton produit un email" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5c0"/><stop offset="1" stop-color="#8b7bff"/></linearGradient>
<linearGradient id="acc2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#ff6b9d"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171a3a"/><stop offset="1" stop-color="#0e1330"/></linearGradient>
<linearGradient id="bgh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#1a1545"/><stop offset="1" stop-color="#0a3a40"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1000" height="330" rx="18" fill="#0d1020"/>
<rect x="20" y="24" width="450" height="282" rx="16" fill="url(#card)" stroke="#8b7bff" stroke-opacity="0.7" stroke-width="1.8"/>
<text x="44" y="58" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" letter-spacing="2" fill="#8b7bff">PROMPT STRUCTURÉ</text>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.0s" dur="0.5s" fill="freeze"/><rect x="44" y="90" width="123" height="36" rx="10" fill="#ff6b9d" fill-opacity="0.16" stroke="#ff6b9d"/><text x="105.5" y="114" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="17" font-weight="700" fill="#ff6b9d">[CONTEXT]</text><text x="181" y="114" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#ffffff">Proposer un rendez-vous</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.5s" fill="freeze"/><rect x="44" y="144" width="90" height="36" rx="10" fill="#8b7bff" fill-opacity="0.16" stroke="#8b7bff"/><text x="89.0" y="168" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="17" font-weight="700" fill="#8b7bff">[TONE]</text><text x="148" y="168" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#ffffff">formel</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.5s" fill="freeze"/><rect x="44" y="198" width="101" height="36" rx="10" fill="#00e5c0" fill-opacity="0.16" stroke="#00e5c0"/><text x="94.5" y="222" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="17" font-weight="700" fill="#00e5c0">[EMAIL]</text></g>
<rect x="159" y="198" width="11" height="24" fill="#00e5c0"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
<text x="44" y="276" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#9aa3d0">À l'inférence, seul ce préfixe est fourni au modèle.</text>
<line x1="478" y1="165" x2="516" y2="165" stroke="#00e5c0" stroke-width="3" stroke-dasharray="6 4"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.4s" repeatCount="indefinite"/></line><polygon points="526,165 514,157 514,173" fill="#00e5c0"/>
<text x="500" y="146" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#9aa3d0">GPT-2</text>
<rect x="530" y="24" width="450" height="282" rx="16" fill="url(#card)" stroke="#00e5c0" stroke-opacity="0.7" stroke-width="1.8"/>
<text x="554" y="58" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" letter-spacing="2" fill="#00e5c0">EMAIL GÉNÉRÉ</text>
<text x="554" y="118" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15.5" fill="#eef1ff" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.4s" fill="freeze"/>Dear Mr. Dupont,</text>
<text x="554" y="156" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15.5" fill="#eef1ff" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.4s" fill="freeze"/>I hope you are well. I would like to propose</text>
<text x="554" y="194" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15.5" fill="#eef1ff" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.4s" fill="freeze"/>a meeting next week to ...</text>
<text x="554" y="276" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#9aa3d0">Sortie en anglais, langue du dataset.</text>

